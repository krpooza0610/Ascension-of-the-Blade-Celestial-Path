<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<style>
body { margin: 0; background: #1a1a1a; color: white; font-family: sans-serif; overflow: hidden; }
/* แถบข้อมูลตัวละครที่ลากได้ */
#character-popup { position: absolute; top: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px; border-radius: 10px; border: 1px solid gold; cursor: move; z-index: 100; }
/* เมนูหลักที่ซ่อนอยู่ */
#menu-container { position: absolute; top: 10px; right: 10px; z-index: 200; }
.menu-btn { background: gold; padding: 10px; border-radius: 50%; border: none; font-size: 20px; }
#menu-list { display: none; margin-top: 10px; background: #333; padding: 10px; border-radius: 10px; transition: all 0.3s; }
/* หลอด EXP ด้านล่าง */
#exp-bar-container { position: absolute; bottom: 0; width: 100%; height: 30px; background: #000; border-top: 2px solid gold; display: flex; align-items: center; justify-content: center; }
#exp-bar { height: 100%; background: linear-gradient(to right, #4facfe, #00f2fe); width: 50%; }
#exp-text { position: absolute; font-weight: bold; text-shadow: 1px 1px 2px black; }

html, body {
height: 100%;
overflow: hidden; /* กันการไถในโหมดปกติ */
}

/* แต่ถ้าเป็นแนวนอน ให้ยอมให้เลื่อนนิดเดียวเพื่อซ่อน URL */
@media screen and (orientation: landscape) {
body {
height: 110vh; /* ยาวกว่าหน้าจอ 10% */
overflow-y: scroll;
}
}
</style>
</head>
<body>

<!-- แถบข้อมูลตัวละคร -->
<div id="character-popup" onmousedown="dragElement(this)">
<div>ชื่อ: จอมยุทธภู</div>
<div>HP: 100/100 | MP: 50/50</div>
</div>

<!-- เมนู -->
<div id="menu-container">
<button class="menu-btn" onclick="toggleMenu()">☰</button>
<button onclick="toggleFullScreen()" style="position:fixed; bottom:40px; right:10px; z-index:999; background:rgba(0,0,0,0.5); color:white; border:1px solid white; border-radius:5px;">🔲 เต็มจอ</button>
<div id="menu-list">
<div onclick="alert('ตัวละคร')">👤 ตัวละคร</div>
<div onclick="alert('ทักษะ')">⚔️ ทักษะ</div>
<div onclick="alert('กระเป๋า')">🎒 กระเป๋า</div>
</div>
</div>

<!-- หลอด EXP -->
<div id="exp-bar-container">
<div id="exp-bar"></div>
<span id="exp-text">50%</span>
</div>

<script>
// สั่งเมนูแสดง/ซ่อน แบบสมูท
function toggleMenu() {
const menu = document.getElementById('menu-list');
menu.style.display = (menu.style.display === 'block') ? 'none' : 'block';
}

// ระบบลาก Pop-up
function dragElement(elmnt) {
let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
elmnt.onmousedown = dragMouseDown;
function dragMouseDown(e) {
pos3 = e.clientX; pos4 = e.clientY;
document.onmouseup = () => { document.onmouseup = null; document.onmousemove = null; };
document.onmousemove = (e) => {
pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
pos3 = e.clientX; pos4 = e.clientY;
elmnt.style.top = (elmnt.offsetTop - pos2) + "px";
elmnt.style.left = (elmnt.offsetLeft - pos1) + "px";
};
}
}

// ฟังก์ชันสลับโหมดเต็มจอ
function toggleFullScreen() {
if (!document.fullscreenElement) {
document.documentElement.requestFullscreen().catch(err => {
alert(`Error: ${err.message}`);
});
} else {
if (document.exitFullscreen) {
document.exitFullscreen();
}
}
}
</script>
</body>
</html>
